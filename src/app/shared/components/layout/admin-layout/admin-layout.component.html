<div class="dashboard-home dashboard-layout-page" dir="rtl">
  <header class="dashboard-home__header dashboard-layout-page__header">
    <button
      type="button"
      class="dashboard-home__menu"
      (click)="isSidebarOpen = true"
      [attr.aria-label]="'DASHBOARD.AUTO_STR_301' | translate"
    >
      <lucide-icon [img]="MenuIcon" size="27" strokeWidth="2"></lucide-icon>
    </button>

    <div class="dashboard-home__brand" aria-label="LOXX KING">
      <span class="dashboard-home__brand-primary">LOXX</span>
      <span class="dashboard-home__brand-secondary">KING</span>
    </div>

    <div class="dashboard-home__header-actions" [attr.aria-label]="'DASHBOARD.AUTO_STR_48' | translate">
      <!-- One gear in place of the old «عرض الأسعار» / «عرض المنتجات» pair. It opens a small menu:
           the products screen and the categories screen. -->
      <div class="lk-settings-menu">
        <button
          type="button"
          class="dashboard-home__settings-button"
          (click)="isSettingsMenuOpen = !isSettingsMenuOpen"
          [attr.aria-expanded]="isSettingsMenuOpen"
          aria-haspopup="menu"
          [attr.title]="'ADMIN_SETTINGS_MENU.TITLE' | translate"
          [attr.aria-label]="'ADMIN_SETTINGS_MENU.TITLE' | translate"
        >
          <lucide-icon [img]="SettingsIcon" size="15" strokeWidth="2.2"></lucide-icon>
        </button>

        <ng-container *ngIf="isSettingsMenuOpen">
          <button
            type="button"
            class="lk-settings-menu__backdrop"
            (click)="isSettingsMenuOpen = false"
            [attr.aria-label]="'COMMON.CLOSE' | translate"
          ></button>
          <div class="lk-settings-menu__list" role="menu">
            <button type="button" role="menuitem" class="lk-settings-menu__item" (click)="openSettingsItem('/admin/products')">
              <lucide-icon [img]="PackageIcon" size="16"></lucide-icon>
              <span>{{ 'ADMIN_SETTINGS_MENU.ADD_PRODUCT' | translate }}</span>
            </button>
            <button type="button" role="menuitem" class="lk-settings-menu__item" (click)="openSettingsItem('/admin/categories')">
              <lucide-icon [img]="TagIcon" size="16"></lucide-icon>
              <span>{{ 'ADMIN_SETTINGS_MENU.MANAGE_CATEGORIES' | translate }}</span>
            </button>
          </div>
        </ng-container>
      </div>
    </div>
  </header>

  <main class="dashboard-layout-page__content">
    <ng-content></ng-content>
  </main>

  <div class="dashboard-sidebar-layer" *ngIf="isSidebarOpen">
    <button
      type="button"
      class="dashboard-sidebar-layer__backdrop"
      (click)="closeSidebar()"
      [attr.aria-label]="'DASHBOARD.AUTO_STR_221' | translate"
    ></button>

    <aside class="dashboard-sidebar" dir="rtl" [attr.aria-label]="'DASHBOARD.AUTO_STR_20' | translate">
      <header class="dashboard-sidebar__hero">
        <input
          #avatarInput
          type="file"
          accept="image/png,image/jpeg,image/webp"
          class="dashboard-sidebar__avatar-input"
          (change)="handleAvatarChange($event)"
        />

        <button
          type="button"
          class="dashboard-sidebar__avatar"
          (click)="isAvatarActionsOpen = true"
          [attr.aria-label]="'SHARED.AUTO_STR_15' | translate"
        >
          <ng-container *ngIf="activeAccount.avatar; else noAvatar">
            <img [src]="activeAccount.avatar" [alt]="activeAccount.name" />
          </ng-container>
          <ng-template #noAvatar>
            <span>{{ initials(activeAccount.name) }}</span>
          </ng-template>
          <small><lucide-icon [img]="CameraIcon" size="13"></lucide-icon></small>
        </button>

        <div class="dashboard-sidebar__identity dashboard-sidebar__identity--name-only">
          <strong>{{ activeAccount.name }}</strong>
        </div>

        <button
          *ngIf="isRootAdmin; else noSwitchButton"
          type="button"
          class="dashboard-sidebar__switch-button"
          (click)="openAccounts()"
          [attr.aria-label]="'SHARED.AUTO_STR_25' | translate"
          [attr.title]="'SHARED.AUTO_STR_25' | translate"
        >
          <lucide-icon [img]="ArrowLeftRightIcon" size="23" strokeWidth="2.4"></lucide-icon>
        </button>
        <ng-template #noSwitchButton>
          <span class="dashboard-sidebar__switch-placeholder"></span>
        </ng-template>
      </header>

      <ng-container *ngIf="sidebarView === 'menu'">
        <label class="dashboard-sidebar__search">
          <lucide-icon [img]="SearchIcon" size="16"></lucide-icon>
          <input
            [value]="menuSearch"
            (input)="updateMenuSearch($event)"
            placeholder="ابحث في القائمة..."
          />
        </label>

        <nav class="dashboard-sidebar__nav">
          <ng-container *ngFor="let item of visibleLinks">
            <div class="dashboard-sidebar__nav-group" [class.has-children]="item.children?.length">
              <!-- An entry that leaves for the CRM is a real link, as it is in the CRM's own sidebar:
                   the address shows on hover and middle-click opens it in a new tab. -->
              <a
                *ngIf="!item.children?.length && item.externalUrl; else navRowButton"
                class="dashboard-sidebar__nav-row"
                [href]="item.externalUrl"
                (click)="closeSidebar()"
              >
                <ng-container *ngTemplateOutlet="navRowContent; context: { $implicit: item }"></ng-container>
              </a>

              <ng-template #navRowButton>
                <button
                  type="button"
                  class="dashboard-sidebar__nav-row"
                  [class.is-active]="isRouteActive(pathname, item.path) || (item.children && item.children.length > 0 && isRouteActive(pathname, item.children[0].path))"
                  (click)="item.children?.length ? openSubmenu(item.key) : openEntry(item)"
                >
                  <ng-container *ngTemplateOutlet="navRowContent; context: { $implicit: item }"></ng-container>
                </button>
              </ng-template>
            </div>
          </ng-container>

          <ng-template #navRowContent let-item>
            <span class="dashboard-sidebar__nav-main">
              <span class="crm-menu-icon" *ngIf="item.iconHtml; else storeItemIcon" [innerHTML]="item.iconHtml"></span>
              <ng-template #storeItemIcon>
                <lucide-icon [img]="item.icon" size="17"></lucide-icon>
              </ng-template>
              <span>{{ item.label | translate }}</span>
            </span>
            <lucide-icon [img]="ChevronLeftIcon" size="15"></lucide-icon>
          </ng-template>

          <p class="dashboard-sidebar__empty" *ngIf="visibleLinks.length === 0">لا توجد نتائج مطابقة.</p>
        </nav>
      </ng-container>

      <section class="dashboard-sidebar__submenu-view" *ngIf="sidebarView === 'submenu' && activeSubmenu">
        <button
          type="button"
          class="dashboard-sidebar__submenu-back"
          (click)="returnToMainMenu()"
        >
          <lucide-icon [img]="ChevronRightIcon" size="16"></lucide-icon>
          <span>{{ 'COMMON.BACK' | translate }}</span>
        </button>

        <div class="dashboard-sidebar__submenu-title">
          <span class="dashboard-sidebar__submenu-title-icon">
            <span class="crm-menu-icon" *ngIf="activeSubmenu.iconHtml; else submenuTitleIcon" [innerHTML]="activeSubmenu.iconHtml"></span>
            <ng-template #submenuTitleIcon>
              <lucide-icon [img]="activeSubmenu.icon" size="18"></lucide-icon>
            </ng-template>
          </span>
          <strong>{{ activeSubmenu.label | translate }}</strong>
        </div>

        <div class="dashboard-sidebar__submenu-list">
          <ng-container *ngFor="let child of activeSubmenu.children">
            <a
              *ngIf="child.externalUrl; else submenuRowButton"
              class="dashboard-sidebar__submenu-page-row"
              [href]="child.externalUrl"
              (click)="closeSidebar()"
            >
              <ng-container *ngTemplateOutlet="submenuRowContent; context: { $implicit: child }"></ng-container>
            </a>

            <ng-template #submenuRowButton>
              <button
                type="button"
                class="dashboard-sidebar__submenu-page-row"
                [class.is-active]="isRouteActive(pathname, child.path)"
                (click)="openEntry(child)"
              >
                <ng-container *ngTemplateOutlet="submenuRowContent; context: { $implicit: child }"></ng-container>
              </button>
            </ng-template>
          </ng-container>

          <ng-template #submenuRowContent let-child>
            <span class="dashboard-sidebar__submenu-page-icon">
              <span class="crm-menu-icon" *ngIf="child.iconHtml; else storeChildIcon" [innerHTML]="child.iconHtml"></span>
              <ng-template #storeChildIcon>
                <ng-container *ngIf="child.key.includes('add'); else submenuIcon">
                  +
                </ng-container>
                <ng-template #submenuIcon>
                  <lucide-icon [img]="activeSubmenu.icon" size="15"></lucide-icon>
                </ng-template>
              </ng-template>
            </span>
            <span>{{ child.label | translate }}</span>
          </ng-template>
        </div>
      </section>

      <section class="dashboard-sidebar__accounts-view" *ngIf="sidebarView === 'accounts'">
        <button
          type="button"
          class="dashboard-sidebar__accounts-back"
          (click)="returnToMainMenu()"
        >
          <lucide-icon [img]="ChevronRightIcon" size="16"></lucide-icon>
          <span>{{ 'SHARED.AUTO_STR_39' | translate }}</span>
        </button>

        <label class="dashboard-sidebar__search dashboard-sidebar__search--accounts">
          <lucide-icon [img]="SearchIcon" size="16"></lucide-icon>
          <input
            [value]="accountSearch"
            (input)="updateAccountSearch($event)"
            placeholder="ابحث باسم الموظف أو البريد..."
            autofocus
          />
        </label>

        <div class="dashboard-sidebar__accounts-list">
          <button
            *ngFor="let account of visibleAccounts"
            type="button"
            class="dashboard-sidebar__account-card"
            [class.is-current]="account.id === activeAccount.id"
            (click)="chooseAccount(account)"
          >
            <span class="dashboard-sidebar__account-avatar">
              <ng-container *ngIf="account.avatar; else noListAvatar">
                <img [src]="account.avatar" alt="" />
              </ng-container>
              <ng-template #noListAvatar>
                {{ initials(account.name) }}
              </ng-template>
            </span>
            <span class="dashboard-sidebar__account-info">
              <strong>{{ account.name }}</strong>
              <small>{{ account.roleLabel }}</small>
              <em>{{ account.email }}</em>
            </span>
            <lucide-icon *ngIf="account.id === activeAccount.id" [img]="CheckCircle2Icon" size="17"></lucide-icon>
          </button>

          <p class="dashboard-sidebar__empty" *ngIf="visibleAccounts.length === 0">لا يوجد حساب بهذا الاسم.</p>
        </div>
      </section>

      <button type="button" class="dashboard-sidebar__logout" (click)="logout()">
        <span>{{ 'DASHBOARD.AUTO_STR_445' | translate }}</span>
        <lucide-icon [img]="LogOutIcon" size="17"></lucide-icon>
      </button>

      <div class="dashboard-sidebar__avatar-sheet-layer" *ngIf="isAvatarActionsOpen">
        <button
          type="button"
          class="dashboard-sidebar__avatar-sheet-backdrop"
          (click)="isAvatarActionsOpen = false"
          [attr.aria-label]="'SHARED.AUTO_STR_26' | translate"
        ></button>
        <section class="dashboard-sidebar__avatar-sheet" role="dialog" aria-modal="true">
          <h3>{{ 'SHARED.AUTO_STR_64' | translate }}</h3>
          <button
            type="button"
            (click)="avatarInputRef.nativeElement.click()"
            [disabled]="isAvatarLoading"
          >
            <lucide-icon [img]="CameraIcon" size="17"></lucide-icon>
            <span>{{ isAvatarLoading ? 'جاري تجهيز الصورة...' : ('DASHBOARD.AUTO_STR_284' | translate) }}</span>
          </button>
          <button *ngIf="activeAccount.avatar" type="button" class="is-danger" (click)="removeAvatar()">
            <lucide-icon [img]="Trash2Icon" size="17"></lucide-icon>
            <span>{{ 'SHARED.AUTO_STR_69' | translate }}</span>
          </button>
          <button type="button" (click)="isAvatarActionsOpen = false">
            <lucide-icon [img]="XIcon" size="17"></lucide-icon>
            <span>{{ 'COMMON.CANCEL' | translate }}</span>
          </button>
        </section>
      </div>
    </aside>
  </div>
</div>

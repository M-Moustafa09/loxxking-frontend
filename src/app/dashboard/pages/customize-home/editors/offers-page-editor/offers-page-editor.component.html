<div class="w-full flex flex-col gap-2 pb-24" dir="rtl">
    <div class="text-center mb-4">
        <h2 class="text-xl font-bold text-gray-900 mb-1">{{ 'OFFERS.TITLE' | translate }}</h2>
        <p class="text-sm text-gray-500">قم بتخصيص نصوص وأقسام صفحة العروض والتخفيضات</p>
    </div>

    <!-- 1. البانر الرئيسي -->
    <app-section-card 
        title="البانر الرئيسي (Hero)" 
        [index]="0" 
        [enabled]="config().showHero" 
        [isFirst]="true" 
        [isLast]="false"
        [draggable]="false" 
        [showReorder]="false" 
        [showCopy]="false" 
        [showDelete]="false" 
        (toggle)="updateConfig({ showHero: $event })">
        <app-bilingual-input 
            title="عنوان البانر" 
            labelAr="عربي / AR" 
            labelEn="English / EN" 
            [valueAr]="$any(config())['heroTitleAr'] || ''" 
            [valueEn]="$any(config())['heroTitleEn'] || ''" 
            (valueChange)="updateBilingualField('heroTitle', $event.lang, $event.value)">
        </app-bilingual-input>
        <app-bilingual-input 
            title="النص الفرعي" 
            labelAr="عربي / AR" 
            labelEn="English / EN" 
            [valueAr]="$any(config())['heroSubtitleAr'] || ''" 
            [valueEn]="$any(config())['heroSubtitleEn'] || ''" 
            (valueChange)="updateBilingualField('heroSubtitle', $event.lang, $event.value)">
        </app-bilingual-input>
    </app-section-card>

    <!-- 2. التخفيضات الحالية -->
    <app-section-card 
        title="التخفيضات الحالية" 
        [index]="1" 
        [enabled]="config().showCurrentOffers" 
        [isFirst]="false" 
        [isLast]="true"
        [draggable]="false" 
        [showReorder]="false" 
        [showCopy]="false" 
        [showDelete]="false" 
        (toggle)="updateConfig({ showCurrentOffers: $event })">
        <app-bilingual-input 
            title="عنوان القسم" 
            labelAr="عربي / AR" 
            labelEn="English / EN" 
            [valueAr]="$any(config())['currentOffersTitleAr'] || ''" 
            [valueEn]="$any(config())['currentOffersTitleEn'] || ''" 
            (valueChange)="updateBilingualField('currentOffersTitle', $event.lang, $event.value)">
        </app-bilingual-input>
    </app-section-card>
</div>

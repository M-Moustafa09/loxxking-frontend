<a [routerLink]="['/product', product.id]" 
   class="group block bg-card rounded-2xl overflow-hidden border border-border hover:border-brand transition-all duration-200 hover:shadow-lg tap-highlight">
  <div class="relative overflow-hidden bg-muted" [ngStyle]="{'aspect-ratio': compact ? '1' : '3/4'}">
    <div *ngIf="!imgLoaded()" class="skeleton absolute inset-0"></div>
    <img [src]="product.images[0]" 
         [alt]="name" 
         (load)="imgLoaded.set(true)"
         class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500"
         [ngClass]="imgLoaded() ? 'opacity-100' : 'opacity-0'" />
    
    <span *ngIf="product.badge" class="absolute top-2 start-2 bg-brand text-[#0E0E11] text-xs font-bold px-2 py-0.5 rounded-full">
      {{product.badge}}
    </span>
    
    <span *ngIf="product.isNew && !product.badge" class="absolute top-2 start-2 bg-brand text-[#0E0E11] text-xs font-bold px-2 py-0.5 rounded-full">
      {{ isNewText }}
    </span>
    
    <button type="button" 
            (click)="handleFavorite($event)"
            class="absolute top-2 end-2 w-8 h-8 rounded-full flex items-center justify-center transition-all tap-highlight"
            [ngClass]="favorite() ? 'bg-red-500 text-white' : 'bg-white/80 text-foreground'"
            [attr.aria-label]="favorite() ? (lang() === 'ar' ? 'إزالة من المفضلة' : 'Remove from favorites') : (lang() === 'ar' ? 'إضافة إلى المفضلة' : 'Add to favorites')"
            [attr.aria-pressed]="favorite()">
      <lucide-icon name="heart" [size]="14" [attr.fill]="favorite() ? 'currentColor' : 'none'" [img]="Heart"></lucide-icon>
    </button>
    
    <button *ngIf="!compact"
            type="button" 
            (click)="handleQuickAdd($event)"
            class="absolute bottom-2 end-2 w-9 h-9 bg-brand rounded-full flex items-center justify-center shadow-lg opacity-0 group-hover:opacity-100 translate-y-2 group-hover:translate-y-0 transition-all duration-200 tap-highlight">
      <lucide-icon name="shopping-cart" [size]="16" class="text-[#0E0E11]" [img]="ShoppingCart"></lucide-icon>
    </button>
  </div>
  
  <div class="p-3">
    <p class="text-xs text-muted-foreground mb-0.5 truncate">
      {{categoryFormatted}}
    </p>
    <h3 class="font-display font-semibold text-sm leading-tight line-clamp-2 mb-1.5">{{name}}</h3>
    
    <div *ngIf="!compact" class="flex items-center gap-1 mb-2">
      <lucide-icon name="star" [size]="11" class="text-amber-400 fill-amber-400" [img]="Star"></lucide-icon>
      <span class="text-xs font-medium">{{product.rating}}</span>
      <span class="text-xs text-muted-foreground">({{product.reviewCount}})</span>
    </div>
    
    <div class="flex items-center gap-2">
      <!-- The currency is the visitor's (their country's, or USD); it used to be a hard-coded «$». -->
      <span class="font-display font-bold text-brand">{{product.price}} {{ 'COMMON.CURRENCY' | translate }}</span>
      <span *ngIf="product.originalPrice && product.originalPrice > product.price" class="text-xs text-muted-foreground line-through">{{product.originalPrice}} {{ 'COMMON.CURRENCY' | translate }}</span>
      <app-badge *ngIf="discount > 0" variant="danger" size="sm">{{discount}}% {{tDiscount}}</app-badge>
    </div>
  </div>
</a>
